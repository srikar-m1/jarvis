[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-jarvis"
version = "0.2.0"
description = "A local-first voice assistant with safe automation and persistent reminders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.26,<3",
    "openai-whisper>=20240930",
    "sounddevice>=0.5,<1",
]
dev = [
    "ruff>=0.9,<1",
    "coverage>=7.6,<8",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
